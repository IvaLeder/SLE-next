<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">A number range narrowing to 90</title>
  <desc id="desc">Seven horizontal bars show the possible range shrinking from 1 to 100 until only 90 remains.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#24203f" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#675ee8"/>
      <stop offset="1" stop-color="#4f46c7"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="820" rx="34" fill="#f8f6ff"/>
  <path d="M750 36v748" stroke="#d9d4f4" stroke-width="4" stroke-dasharray="8 14"/>

  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(0 42)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">0</text>
      <rect x="150" y="0" width="1200" height="84" rx="20" fill="url(#bar)" filter="url(#shadow)"/>
      <text x="750" y="54" font-size="36" font-weight="700" fill="#fff">1–100</text>
    </g>
    <g transform="translate(0 150)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">1</text>
      <rect x="450" y="0" width="600" height="84" rx="20" fill="url(#bar)" filter="url(#shadow)"/>
      <text x="750" y="54" font-size="36" font-weight="700" fill="#fff">51–100</text>
    </g>
    <g transform="translate(0 258)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">2</text>
      <rect x="600" y="0" width="300" height="84" rx="20" fill="url(#bar)" filter="url(#shadow)"/>
      <text x="750" y="54" font-size="34" font-weight="700" fill="#fff">76–100</text>
    </g>
    <g transform="translate(0 366)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">3</text>
      <rect x="660" y="0" width="180" height="84" rx="20" fill="#6259dc" filter="url(#shadow)"/>
      <text x="750" y="53" font-size="30" font-weight="700" fill="#fff">89–100</text>
    </g>
    <g transform="translate(0 474)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">4</text>
      <rect x="690" y="0" width="120" height="84" rx="20" fill="#7167e6" filter="url(#shadow)"/>
      <text x="750" y="53" font-size="28" font-weight="700" fill="#fff">89–93</text>
    </g>
    <g transform="translate(0 582)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">5</text>
      <rect x="702" y="0" width="96" height="84" rx="20" fill="#8176eb" filter="url(#shadow)"/>
      <text x="750" y="53" font-size="25" font-weight="700" fill="#fff">89–90</text>
    </g>
    <g transform="translate(0 690)">
      <circle cx="105" cy="42" r="29" fill="#ece9ff"/><text x="105" y="52" font-size="28" font-weight="700" fill="#514a76">6</text>
      <circle cx="750" cy="42" r="54" fill="#d49a22" filter="url(#shadow)"/>
      <circle cx="750" cy="42" r="43" fill="#fff6d9"/>
      <text x="750" y="55" font-size="38" font-weight="800" fill="#42380f">90</text>
    </g>
  </g>
</svg>
